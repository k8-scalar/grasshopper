
version: "1.2.0"

persistenceReplicas: 1
persistenceCpu: 300m
persistenceMemory: 500Mi

webuiReplicas: 1
webuiCpu: 300m
webuiMemory: 1024Mi

recommenderReplicas: 1
recommenderCpu: 300m
recommenderMemory: 500Mi

registryReplicas: 1
registryCpu: 300m
registryMemory: 500Mi

dbReplicas: 1
dbCpu: 200m
dbMemory: 500Mi

authReplicas: 1
authCpu: 300m
authMemory: 500Mi


imageReplicas: 1
imageCpu: 300m
imageMemory: 800Mi


image:
  pullPolicy: IfNotPresent
