apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-a-allow-frontend-backend
  namespace: test-thesis
spec:
  podSelector:
    matchLabels:
      app: app-a
      role: backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app-a
              role: frontend
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: app-a
              role: backend
  policyTypes:
    - Ingress
    - Egress
