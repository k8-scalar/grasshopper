apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-a-allow-backend-frontend
  namespace: test-thesis
spec:
  podSelector:
    matchLabels:
      app: app-a
      role: backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app-a
              role: frontend
        
      ports:
        - protocol: TCP
          port: 80 
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: app-a
              role: frontend
      ports:
        - protocol: TCP
          port: 80 
  policyTypes:
    - Ingress
    - Egress
