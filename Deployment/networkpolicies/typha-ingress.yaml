# Lets Felix (calico-node, on every node) reach Typha (which can land on any
# node) on port 5473 - baseline Calico control-plane plumbing that Grasshopper
# itself depends on (workerSG's static rules only cover the egress side - see
# create_master_and_workerSG.py - the ingress side only exists once this
# policy is applied and Grasshopper has processed it). Nobody else creates
# this automatically, so install_grasshopper.sh applies it as part of
# deploying Grasshopper - see README.md.
#
# CNI-specific by nature (this one assumes Calico's Typha/Felix split): if
# your cluster runs a different CNI, replace this file (or add your own
# alongside it) with whatever bootstrap NetworkPolicy your CNI's control
# plane needs - install_grasshopper.sh applies every *.yaml file in this
# directory, without knowing anything about what's inside them.
#
# A single CIDR covering the whole node subnet, not one /32 peer per node.
# Deliberately not using install_grasshopper.sh's __NODE_CIDRS__ token here.
#
# WatchDog.redundant()/conflicting() in watchdog.py used to never inspect a
# CIDR-typed allow-rule's content at all, only whether some other policy
# shared the same selector - so a policy with N>1 separate ipBlock peers
# under one selector self-collided the moment split() produced its second
# sub-policy, permanently rejected as "redundant" against its own first
# peer. Confirmed live: a 39-peer, one-/32-per-node version of this exact
# policy was rejected outright, leaving Typha's ingress with zero enforced
# SG rule at all. That specific bug is now fixed - conflicting()/redundant()
# genuinely compare CIDR containment via WatchDog._peer_issubset(), so
# disjoint peers (e.g. distinct node /32s) no longer collide with each
# other.
#
# Staying on a single CIDR anyway: WatchDog.policy_check() still rejects a
# NetworkPolicy's ENTIRE peer list the moment any ONE split sub-policy fails
# - it doesn't drop just the offending peer. Distinct node IPs can never be
# subsets of each other, so a per-node /32 list is safe under the fixed
# checks specifically - but there's no guard against some other multi-peer
# CIDR list (a broad range alongside a narrower one within it, e.g.) losing
# ALL enforcement over one redundant pairing. See the docstring on
# WatchDog.policy_check() for the full explanation - this is a known,
# deliberately-not-yet-fixed structural limitation, not this policy's own
# bug. A single CIDR sidesteps the whole risk class outright.
#
# 172.22.0.0/16 below matches THIS cluster's actual node subnet - edit it to
# your own cluster's node CIDR range before installing on a different one
# (there's no live-discovery equivalent for a single supernet the way
# __NODE_CIDRS__ discovers individual node IPs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grasshopper-typha-ingress
  namespace: __TYPHA_NAMESPACE__
spec:
  podSelector:
    matchLabels:
      k8s-app: calico-typha
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.22.0.0/16
      ports:
        - protocol: TCP
          port: 5473
