apiVersion: v1
kind: ServiceAccount
metadata:
  name: grasshopper-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grasshopper-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources:
    - customresourcedefinitions  
  verbs: ["get", "list", "watch"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grasshopper-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: grasshopper-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: grasshopper-cluster-role
  apiGroup: rbac.authorization.k8s.io


