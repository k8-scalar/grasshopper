apiVersion: v1
kind: Pod
metadata:
  name: grasshopper-operator
  namespace: kube-system
  labels:
    app: grasshopper
spec:
  serviceAccountName: grasshopper-sa
  # Runs on the control-plane node only - the OpenStack credentials
  # (OS_PROJECTS_JSON) must never be materialized on a worker node's kubelet.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node.kubernetes.io/disk-pressure"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: grasshopper
      image: grasshopper:v2
      imagePullPolicy: Never
      command: ["python3", "main_operator.py"]
      args: ["--mode", "PNS"]
      # For multi-domain clusters (nodes spanning multiple OpenStack projects) or
      # if Calico itself uses VXLAN even within one project, add:
      #   args: ["--mode", "PNS", "--intra-project-encapsulation", "vxlan", "--vxlan-port", "4789"]
      # See .env.dist for the OS_PROJECTS_JSON multi-project credential format,
      # and label nodes with grasshopper.io/openstack-project=<key>.
      #
      # --reconcile-interval-seconds (default 60): how often the batch
      # reconciliation loop re-syncs pods against the event-driven handlers'
      # state, catching anything they missed (a handler that exhausted its
      # retries, a watch stream gap). 0 disables it entirely.
      #   args: ["--mode", "PNS", "--reconcile-interval-seconds", "30"]
      #
      # --openstack-timeout-seconds (default 90): timeout for every Neutron/
      # Nova API call. Without one, a single slow/unresponsive OpenStack call
      # blocks forever, holding whatever labelset lock(s) it needs - and for
      # the reconciliation loop specifically, permanently and silently
      # disabling all future ticks. Raise this if your OpenStack API is
      # routinely slower than 90s under load; lower it to fail faster.
      #   args: ["--mode", "PNS", "--openstack-timeout-seconds", "120"]
      envFrom:
        - secretRef:
            name: grasshopper-openstack-creds
  restartPolicy: Never
